spring:
  config:
    activate:
      on-profile: cloud
  thymeleaf:
    cache: true

server:
  # The Compose network is private; Caddy is the sole public listener.
  address: 0.0.0.0
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        secure: true

app:
  runtime:
    mode: cloud
  owner:
    email: ${OWNER_EMAIL:}
    setup-token: ${INITIAL_OWNER_SETUP_TOKEN:}
