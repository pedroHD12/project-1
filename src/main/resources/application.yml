spring:
  application:
    name: mailflow-local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mailflow}
    username: ${DB_USER:mailflow}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  quartz:
    job-store-type: memory
    properties:
      org.quartz.scheduler.instanceName: MailFlowLocal
      org.quartz.threadPool.threadCount: 3
  thymeleaf:
    cache: false
  task:
    scheduling:
      pool:
        size: 2 # Reading the inbox must not block the delivery scheduler.

server:
  address: 127.0.0.1
  port: ${APP_PORT:8080}
  forward-headers-strategy: none
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: strict
        secure: false # Local HTTP only; this release must not be published.
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

# PostgreSQL error details may contain user-entered addresses. Controllers render safe conflicts.
logging:
  level:
    org.hibernate.orm.jdbc.error: "OFF"

app:
  runtime:
    mode: ${APP_RUNTIME_MODE:local}
    database-url: ${DB_URL:jdbc:postgresql://localhost:5432/mailflow}
  credentials:
    key-v1: ${MAILFLOW_CREDENTIAL_KEY_V1:}
    key-v0: ${MAILFLOW_CREDENTIAL_KEY_V0:}
  timezone: ${APP_TIMEZONE:America/Sao_Paulo}
